<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design/Art - Avinash Krishna</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <h1><b>Design/Art</b></h1>
    
    <div class="content-container">
        <div class="instacart-section">
            <h2 id="instacart"><b>Instacart Health</b></h2>
            <p>Proposed a product to CFO, she sent to the whole product team</p>
            <video id="instacart-video" controls preload="metadata">
                <source src="../assets/videos/instacart_health_demo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>
    
    <div class="content-container">
        <div class="painting-section">
            <h2 id="northeastern-painting"><b>Northeastern Painting</b></h2>
            <p>A stylized map painting of Northeastern University and the surrounding Boston area, featuring the Charles River, Ruggles T station, and campus buildings</p>
            <img src="../assets/images/northeastern_painting.jpeg" alt="Stylized map painting of Northeastern University area" class="painting-image">
        </div>
    </div>
    
    <div class="clear-both"></div>

    <div class="back-button">
        <a href="../index.html">← Back to homepage</a>
    </div>

    <script>
        // Get video element and set initial values
        const video = document.getElementById('instacart-video');
        
        // Set volume and start time when video loads
        video.addEventListener('loadedmetadata', function() {
            video.volume = 1.0; // Max browser volume
            video.currentTime = 38.5; // Start at 38.5 seconds
        });
        
        // Auto-play with sound when page loads (user-initiated navigation)
        video.addEventListener('canplay', function() {
            video.play().catch(function(error) {
                console.log('Autoplay failed:', error);
            });
        });
    </script>
</body>
</html>
